<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="color-scheme" content="dark" />
<title>Fleet Docs</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<style>
  /* fc-v84 (op#33598 #586): docs joins the Calm Command system — same tokens,
     header chrome and card language as lanes/asks. DOM/ids unchanged (docs.js
     owns token/connect/main); only additive markup is the build badge. */
  :root{
    --bg:#090b10; --bg-2:#0c0f16;
    --surface:#12161e; --surface-2:#171c26; --surface-3:#1d2430;
    --hair:rgba(255,255,255,.06); --hair-2:rgba(255,255,255,.10);
    --txt:#e8ebf1; --dim:#949cac; --faint:#5c6472;
    --jade:#37d39a; --jade-soft:rgba(55,211,154,.13);
    --indigo:#8aa6ff; --indigo-soft:rgba(138,166,255,.14);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --r-lg:18px; --r:14px; --r-sm:10px;
    --shadow:0 1px 0 rgba(255,255,255,.045) inset, 0 10px 30px -12px rgba(0,0,0,.7);
    --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--txt);
    font:15px/1.5 var(--sans); letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 60% at 50% -8%, rgba(55,211,154,.06), transparent 60%),
      radial-gradient(90% 50% at 50% 0%, rgba(138,166,255,.05), transparent 55%),
      linear-gradient(180deg,var(--bg-2),var(--bg) 40%);
    background-attachment:fixed;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    -webkit-text-size-adjust: 100%;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 11px 16px 13px;
    background:linear-gradient(180deg,rgba(12,15,22,.92),rgba(9,11,16,.72));
    backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);
    border-bottom: 1px solid var(--hair);
  }
  header h1 { font-size:19px; margin:0; font-weight:700; letter-spacing:-.02em; }
  header .navlink { font:600 15px/1 var(--sans); color:var(--dim); text-decoration:none; }
  header .navlink:active { color:var(--txt); }
  .build { margin-left:auto; font:11px/1 var(--mono); color:var(--faint);
    padding:5px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--hair); white-space:nowrap }
  .build .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--jade);
    margin-right:5px;box-shadow:0 0 6px var(--jade);vertical-align:middle}
  .token-row { width: 100%; display: flex; gap: 8px; align-items: center; }
  .token-row input {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--hair);
    color: var(--txt); border-radius: var(--r); padding: 0 12px; height: 38px;
    font: 13px var(--mono);
  }
  button {
    background: var(--surface-2); border: 1px solid var(--hair); color: var(--txt);
    border-radius: var(--r); padding: 0 16px; height: 38px;
    font: 600 12px/1 var(--mono); cursor: pointer; white-space: nowrap; flex: none;
  }
  button:active { background: var(--surface-3); }
  button.ghost { background: transparent; }

  main { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }

  /* ---- catalog ---- */
  .repo-head {
    position: sticky; top: 0; z-index: 1;
    background: linear-gradient(180deg, var(--bg), rgba(9,11,16,.88));
    backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);
    padding: 14px 16px 8px; font: 700 10px/1 var(--mono); text-transform: uppercase;
    letter-spacing:.12em; color: var(--faint); border-bottom: 1px solid var(--hair);
  }
  .repo-head .count { color: var(--dim); font-weight: 500; }
  .doc {
    display: block; text-decoration: none; color: inherit;
    margin: 8px 14px 0; padding: 12px 13px;
    border: 1px solid var(--hair-2); border-radius: var(--r-sm);
    background: var(--surface); box-shadow: var(--shadow);
  }
  .doc:active { background: var(--surface-2); }
  .doc .title { font-weight:600; font-size:13.5px; line-height:1.35; overflow-wrap:anywhere; }
  .doc .meta { margin-top: 5px; font:11px/1.3 var(--mono); color: var(--faint); overflow-wrap: anywhere; }
  .empty { padding: 40px 16px; color: var(--faint); font:13px var(--mono); text-align: center; }
  .search { width: 100%; }
  .search input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--hair); color: var(--txt);
    border-radius: var(--r); padding: 0 12px; height: 38px; font: 13px var(--mono);
  }

  /* ---- doc viewer ---- */
  .docview { max-width: 760px; margin: 0 auto; padding: 16px 16px 64px; }
  .docview .backbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .docview .crumb { font: 11px var(--mono); color: var(--faint); overflow-wrap: anywhere; }
  .article { word-break: break-word; }
  .article h1 { font-size: 24px; margin: 18px 0 10px; line-height: 1.25; letter-spacing:-.02em; }
  .article h2 { font-size: 20px; margin: 22px 0 8px; line-height: 1.3; border-bottom: 1px solid var(--hair); padding-bottom: 4px; }
  .article h3 { font-size: 17px; margin: 18px 0 6px; }
  .article h4, .article h5, .article h6 { font-size: 15px; margin: 14px 0 4px; color: var(--dim); }
  .article p { margin: 10px 0; }
  .article a { color: var(--indigo); }
  .article ul, .article ol { padding-left: 22px; margin: 8px 0; }
  .article li { margin: 4px 0; }
  .article code {
    font: 13px var(--mono); background: var(--surface-2); border: 1px solid var(--hair);
    border-radius: 4px; padding: 1px 5px;
  }
  .article pre {
    background: var(--surface); border: 1px solid var(--hair); border-radius: var(--r);
    padding: 12px 14px; overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: var(--shadow);
  }
  .article pre code { background: none; border: 0; padding: 0; font-size: 12.5px; line-height: 1.5; }
  .article blockquote {
    margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--indigo);
    color: var(--dim); background: var(--surface);
  }
  .article hr { border: 0; border-top: 1px solid var(--hair); margin: 18px 0; }
  .article strong { color: #fff; }

  @media (min-width: 760px) {
    .token-row { width: auto; margin-left: auto; }
    .token-row input { width: 240px; flex: none; height: 34px; }
    button { height: 34px; }
  }
</style>
</head>
<body>
<header>
  <h1>Fleet Docs</h1>
  <a class="navlink" href="/">&larr; Console</a>
  <span id="build" class="build"><span class="d"></span>fc-v87</span>
  <div class="token-row">
    <input id="token" type="password" inputmode="text" placeholder="operator token" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <button id="connect">Connect</button>
  </div>
</header>

<main id="main">
  <div class="empty">Enter the operator token and Connect.</div>
</main>

<script src="/static/docs.js"></script>
</body>
</html>
