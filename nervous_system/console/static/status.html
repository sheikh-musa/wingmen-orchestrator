<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="color-scheme" content="dark" />
<title>Nothing goes dark</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<style>
  /* fc-v85 (bus 77019, Phase 1): the "nothing goes dark" status view joins the
     Calm Command system — same tokens/header/card language as lanes/asks/docs/
     media. DOM/ids follow the asks pattern (status.js owns token/connect/main);
     the only additive chrome is the build badge (deploy-gate-synced). */
  :root{
    --bg:#090b10; --bg-2:#0c0f16;
    --surface:#12161e; --surface-2:#171c26; --surface-3:#1d2430;
    --hair:rgba(255,255,255,.06); --hair-2:rgba(255,255,255,.10);
    --txt:#e8ebf1; --dim:#949cac; --faint:#5c6472;
    --jade:#37d39a; --jade-soft:rgba(55,211,154,.13);
    --indigo:#8aa6ff; --indigo-soft:rgba(138,166,255,.14);
    --amber:#f5b942; --amber-soft:rgba(245,185,66,.12);
    --red:#ff7a6e; --red-soft:rgba(255,122,110,.10);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --r-lg:18px; --r:14px; --r-sm:10px;
    --shadow:0 1px 0 rgba(255,255,255,.045) inset, 0 10px 30px -12px rgba(0,0,0,.7);
    --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--txt);
    font:15px/1.5 var(--sans); letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 60% at 50% -8%, rgba(55,211,154,.06), transparent 60%),
      radial-gradient(90% 50% at 50% 0%, rgba(138,166,255,.05), transparent 55%),
      linear-gradient(180deg,var(--bg-2),var(--bg) 40%);
    background-attachment:fixed;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    -webkit-text-size-adjust: 100%;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 11px 16px 13px;
    background:linear-gradient(180deg,rgba(12,15,22,.92),rgba(9,11,16,.72));
    backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);
    border-bottom: 1px solid var(--hair);
  }
  header h1 { font-size:19px; margin:0; font-weight:700; letter-spacing:-.02em; }
  header .navlink { font:600 15px/1 var(--sans); color:var(--dim); text-decoration:none; }
  header .navlink:active { color:var(--txt); }
  .build { margin-left:auto; font:11px/1 var(--mono); color:var(--faint);
    padding:5px 9px; border-radius:999px; background:var(--surface); border:1px solid var(--hair); white-space:nowrap }
  .build .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--jade);
    margin-right:5px;box-shadow:0 0 6px var(--jade);vertical-align:middle}
  .token-row { width: 100%; display: flex; gap: 8px; align-items: center; }
  .token-row input {
    flex: 1; min-width: 0; background: var(--surface-2); border: 1px solid var(--hair);
    color: var(--txt); border-radius: var(--r); padding: 0 12px; height: 38px;
    font: 13px var(--mono);
  }
  button {
    background: var(--surface-2); border: 1px solid var(--hair); color: var(--txt);
    border-radius: var(--r); padding: 0 16px; height: 38px;
    font: 600 12px/1 var(--mono); cursor: pointer; white-space: nowrap; flex: none;
  }
  button:active { background: var(--surface-3); }
  button.ghost { background: transparent; }

  main { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; }

  .repo-head {
    position: sticky; top: 0; z-index: 1;
    background: linear-gradient(180deg, var(--bg), rgba(9,11,16,.88));
    backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);
    padding: 14px 16px 8px; border-bottom: 1px solid var(--hair);
  }
  .empty { padding: 40px 16px; color: var(--faint); font:13px var(--mono); text-align: center; }
  .search input, input.search {
    width: 100%; background: var(--surface-2); border: 1px solid var(--hair); color: var(--txt);
    border-radius: var(--r); padding: 0 12px; height: 38px; font: 13px var(--mono);
  }

  /* ---- hero counts ---- */
  .hero {
    margin: 12px 14px 4px; padding: 14px 16px;
    background: var(--surface); border: 1px solid var(--hair-2);
    border-radius: var(--r-lg); box-shadow: var(--shadow);
    font: 600 15px/1.4 var(--sans); color: var(--dim);
    display:flex; flex-wrap:wrap; align-items:baseline; gap: 6px;
  }
  .hero .big { font-size:26px; font-weight:800; color: var(--txt); }
  .hero .warn { color: var(--amber); }
  .hero .sep { color: var(--faint); }

  .section {
    padding: 14px 16px 6px; font: 700 10px/1 var(--mono); text-transform: uppercase;
    letter-spacing:.12em; color: var(--faint);
  }
  .section:first-of-type { margin-top: 4px; }

  /* ---- item cards ---- */
  .items { padding: 0 14px 16px; }
  .item {
    background: var(--surface); border: 1px solid var(--hair-2);
    border-radius: var(--r); box-shadow: var(--shadow);
    padding: 12px 14px; margin: 8px 0;
  }
  .item.dark { border-left: 3px solid var(--amber); }
  .item .t { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .item .ttl { font:600 14px/1.4 var(--sans); color:var(--txt); overflow-wrap:anywhere; }
  .pill {
    flex:none; font:700 9px/1 var(--mono); letter-spacing:.08em; text-transform:uppercase;
    padding:4px 8px; border-radius:999px; background:var(--amber-soft); color:var(--amber);
    border:1px solid rgba(245,185,66,.25); white-space:nowrap;
  }
  .item.dark.breach .pill, .pill.breach { background:var(--red-soft); color:var(--red);
    border-color:rgba(255,122,110,.3); }
  .item .meta {
    display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px;
    font:11px/1.5 var(--mono); color:var(--faint);
  }
  .item .meta .kind {
    color:var(--indigo); background:var(--indigo-soft);
    padding:1px 7px; border-radius:6px; font-weight:600;
  }
  .item .meta .owner { color:var(--dim); }
  .item .meta .party { color:var(--jade); }
  .item .meta .src { overflow-wrap:anywhere; }

  @media (min-width: 760px) {
    .token-row { width: auto; margin-left: auto; }
    .token-row input { width: 240px; flex: none; height: 34px; }
    button { height: 34px; }
    .items { max-width: 860px; margin: 0 auto; width: 100%; }
    .hero { max-width: 860px; margin-left:auto; margin-right:auto; width: calc(100% - 28px); }
  }
</style>
</head>
<body>
<header>
  <h1>Nothing goes dark</h1>
  <a class="navlink" href="/">&larr; Console</a>
  <a class="navlink" href="/asks">Asks</a>
  <a class="navlink" href="/builds">Building</a>
  <a class="navlink" href="/docs">Docs</a>
  <span id="build" class="build"><span class="d"></span>fc-v96</span>
  <div class="token-row">
    <input id="token" type="password" inputmode="text" placeholder="operator token" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <button id="connect">Connect</button>
  </div>
</header>

<main id="main">
  <div class="empty">Enter the operator token and Connect.</div>
</main>

<script src="/static/status.js"></script>
</body>
</html>
