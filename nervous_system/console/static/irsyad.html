<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Irsyad · Fleet</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<style>
  /* ── Calm Command — dedicated Irsyad page (op#12501). READ-ONLY: no token/model
     controls, no relaunch. Mirrors the Lane-manager aesthetic (SF Pro structure,
     mono for technical data, jade = all-clear, warm tones only for attention).
     The irsyad family runs on the musa2 pool, shown up top. ── */
  :root{
    --bg:#090b10; --bg-2:#0c0f16;
    --surface:#12161e; --surface-2:#171c26; --surface-3:#1d2430;
    --hair:rgba(255,255,255,.06); --hair-2:rgba(255,255,255,.10);
    --txt:#e8ebf1; --dim:#949cac; --faint:#5c6472;
    --jade:#37d39a; --jade-dim:#1f9e77; --jade-soft:rgba(55,211,154,.13);
    --rose:#fb7185; --rose-soft:rgba(251,113,133,.13);
    --amber:#f6c453; --amber-soft:rgba(246,196,83,.13);
    --indigo:#8aa6ff; --indigo-soft:rgba(138,166,255,.14);
    --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    --r-lg:18px; --r:14px; --r-sm:10px;
    --shadow:0 1px 0 rgba(255,255,255,.045) inset, 0 10px 30px -12px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;overflow-x:hidden}
  body{color:var(--txt); font:15px/1.5 var(--sans); letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(120% 60% at 50% -8%, rgba(55,211,154,.06), transparent 60%),
      radial-gradient(90% 50% at 50% 0%, rgba(138,166,255,.05), transparent 55%),
      linear-gradient(180deg,var(--bg-2),var(--bg) 40%);
    background-attachment:fixed;}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}

  header{position:sticky;top:0;z-index:15;margin:0 -16px 0;
    padding:calc(11px + env(safe-area-inset-top)) 18px 13px;
    background:linear-gradient(180deg,rgba(12,15,22,.92),rgba(9,11,16,.72));
    backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);
    border-bottom:1px solid var(--hair)}
  .top{display:flex;align-items:center;gap:10px}
  .back{color:var(--dim);text-decoration:none;font-size:15px;font-weight:600;flex:none}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.02em}
  .build{margin-left:auto;font:11px/1 var(--mono);color:var(--faint);
    padding:5px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--hair);white-space:nowrap}
  .build .d{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--jade);
    margin-right:5px;box-shadow:0 0 6px var(--jade);vertical-align:middle}
  .refresh{flex:none;border:1px solid var(--hair);background:var(--surface);
    color:var(--dim);font-size:15px;padding:0;width:34px;height:34px;border-radius:11px;
    display:inline-flex;align-items:center;justify-content:center;margin-left:8px}
  .refresh:active{background:var(--surface-2)}
  .sub{margin-top:12px;color:var(--dim);font:12px/1.4 var(--mono);
    display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
  .sub b.good{color:var(--jade)} .sub b.warn{color:var(--amber)} .sub b.bad{color:var(--rose)}

  .pin{font:10px/1 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--faint);
    margin:22px 2px 11px;display:flex;align-items:center;gap:9px}
  .pin::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--hair),transparent)}

  /* ── musa2 weekly-pool card (the pool this family runs on) ── */
  .pool{margin:16px 0 4px;padding:16px 17px;border-radius:var(--r);
    background:linear-gradient(180deg,var(--surface-2),var(--surface));
    border:1px solid var(--hair-2);box-shadow:var(--shadow)}
  .pool .phead{display:flex;align-items:baseline;gap:9px}
  .pool .pname{font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
  .pool .ppct{margin-left:auto;font:800 26px/1 var(--sans);letter-spacing:-.02em}
  .pool .ppct .u{font:600 12px/1 var(--mono);color:var(--faint);margin-left:3px}
  .pool.good .ppct{color:var(--jade)} .pool.warn .ppct{color:var(--amber)} .pool.bad .ppct{color:var(--rose)}
  .pool.stale .ppct{color:var(--faint)}
  .pbar{margin:12px 0 10px;height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden}
  .pbar > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--jade),var(--jade-dim))}
  .pool.warn .pbar > i{background:linear-gradient(90deg,var(--amber),#c8993a)}
  .pool.bad .pbar > i{background:linear-gradient(90deg,var(--rose),#c04a5a)}
  .pmeta{display:flex;flex-wrap:wrap;gap:5px 16px;font:11px/1.5 var(--mono);color:var(--faint)}
  .pmeta b{color:var(--dim);font-weight:600}
  .pmeta .warnpace{color:var(--amber)}

  /* ── lane row: collapsed spine + tap-to-open drawer (read-only detail) ── */
  .lane{position:relative;margin-bottom:9px;border-radius:var(--r);background:var(--surface);
    border:1px solid var(--hair);box-shadow:var(--shadow);overflow:hidden}
  .lane .spine{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--faint);opacity:.5}
  .lane.ok .spine{background:linear-gradient(180deg,var(--jade),var(--jade-dim))}
  .lane.idle .spine{background:linear-gradient(180deg,var(--dim),var(--faint));opacity:.7}
  .lane.flag .spine{background:linear-gradient(180deg,var(--rose),#c04a5a);box-shadow:0 0 10px var(--rose);opacity:1}
  .lane.unver .spine{background:linear-gradient(180deg,var(--amber),#b9862a);opacity:.9}
  .lane .rowtop{display:flex;align-items:center;gap:11px;padding:13px 15px 13px 17px;cursor:pointer}
  .lane .stdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--faint)}
  .lane.ok .stdot{background:var(--jade);box-shadow:0 0 8px var(--jade)}
  .lane.idle .stdot{background:var(--dim)}
  .lane.flag .stdot{background:var(--rose);box-shadow:0 0 8px var(--rose)}
  .lane.unver .stdot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .lane .idwrap{min-width:0;flex:1}
  .lane .id{font-size:14.5px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere;
    display:flex;align-items:center;gap:8px}
  .lane .id .role{font:10px/1 var(--mono);color:var(--indigo);font-weight:600}
  .lane .id .st{font:9px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);
    padding:3px 6px;border-radius:999px;background:var(--surface-2);border:1px solid var(--hair)}
  .lane.ok .id .st{color:var(--jade);border-color:rgba(55,211,154,.25)}
  .lane.flag .id .st{color:var(--rose);border-color:rgba(251,113,133,.3)}
  .lane .sub2{margin-top:3px;font:11px/1.3 var(--mono);color:var(--faint);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lane .acct{flex:none;font:10px/1 var(--mono);font-weight:700;padding:5px 9px;border-radius:999px;
    background:var(--jade-soft);color:var(--jade);border:1px solid rgba(55,211,154,.25);white-space:nowrap}
  .lane.flag .acct{background:var(--rose-soft);color:var(--rose);border-color:rgba(251,113,133,.3)}
  .lane.unver .acct{background:var(--amber-soft);color:var(--amber);border-color:rgba(246,196,83,.3)}
  .lane .chev{flex:none;color:var(--faint);font-size:12px;transition:transform .22s ease}
  .lane.open .chev{transform:rotate(90deg)}

  /* context gauge on the spine row (mini meter + pct) */
  .ctx{display:flex;align-items:center;gap:7px;margin-top:7px}
  .ctx .meter{flex:1;height:5px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:60px}
  .ctx .meter > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--jade),var(--jade-dim))}
  .ctx.amber .meter > i{background:linear-gradient(90deg,var(--amber),#c8993a)}
  .ctx.red .meter > i{background:linear-gradient(90deg,var(--rose),#c04a5a)}
  .ctx .cpct{font:10px/1 var(--mono);color:var(--dim);flex:none}
  .ctx.amber .cpct{color:var(--amber)} .ctx.red .cpct{color:var(--rose)}
  .ctx .cnull{font:10px/1 var(--mono);color:var(--faint)}

  .lane .drawer{display:none;padding:2px 15px 15px 17px}
  .lane.open .drawer{display:block;animation:drop .22s ease}
  @keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .kv{display:grid;grid-template-columns:78px 1fr;gap:6px 12px;font:11.5px/1.5 var(--mono);margin-top:4px}
  .kv .k{color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-size:10px}
  .kv .v{color:var(--dim);overflow-wrap:anywhere}
  .kv .v.txt{font-family:var(--sans);color:var(--txt);font-size:12.5px;white-space:pre-wrap}
  .exp{color:var(--rose);font:11px/1.3 var(--mono);margin-bottom:6px}

  .empty{color:var(--faint);text-align:center;padding:40px 0;font:13px var(--mono)}
  .stamp{color:var(--faint);text-align:center;margin-top:18px;font:11px var(--mono)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <a class="back" href="/fleet">‹ Fleet</a>
      <h1>Irsyad</h1>
      <span id="build" class="build"><span class="d"></span>fc-v52</span>
      <button id="refresh" class="refresh">↻</button>
    </div>
    <div id="sub" class="sub">Loading irsyad…</div>
  </header>
  <div id="pool"></div>
  <div class="pin">Lanes</div>
  <div id="rows"></div>
  <div id="stamp" class="stamp"></div>
</div>
<script src="/static/irsyad.js"></script>
</body>
</html>
