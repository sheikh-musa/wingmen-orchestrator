<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="color-scheme" content="dark" />
<title>Fleet Console</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0b0e14" />
<link rel="icon" href="/static/icons/icon-192.png" />
<!-- iOS ignores the manifest for install chrome; these cover Add-to-Home-Screen there. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fleet" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --panel-2: #1a2030; --line: #232a3a;
    --txt: #d7dce5; --dim: #8a93a6; --accent: #5b8cff; --good: #3ecf8e;
    --warn: #f0b429; --bad: #ff6b6b; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --tap: 44px; /* min touch target */
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh; /* dvh handles mobile browser chrome */
    -webkit-text-size-adjust: 100%;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }

  /* ---- header (mobile-first: wraps) ---- */
  header {
    flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .conn { font: 12px/1 var(--mono); color: var(--dim); }
  header .navlink { font: 13px/1 var(--mono); color: var(--accent); text-decoration: none; font-weight: 600; }
  header .navlink:active { opacity: .7; }
  header .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--dim); margin-right: 6px; vertical-align: middle; }
  header .dot.live { background: var(--good); box-shadow: 0 0 6px var(--good); }
  header .dot.down { background: var(--bad); }
  .token-row { width: 100%; display: flex; gap: 8px; align-items: center; }
  .token-row input {
    flex: 1; min-width: 0; background: var(--panel-2); border: 1px solid var(--line);
    color: var(--txt); border-radius: 8px; padding: 0 12px; height: var(--tap);
    font: 13px var(--mono);
  }
  button {
    background: var(--accent); border: 0; color: #fff; border-radius: 8px;
    padding: 0 16px; height: var(--tap); font-size: 14px; font-weight: 600; cursor: pointer;
    white-space: nowrap; flex: none;
  }
  button:active { transform: translateY(1px); }
  button.ghost { background: var(--panel-2); border: 1px solid var(--line); color: var(--txt); font-weight: 500; }

  /* ---- mobile tab bar (hidden on desktop) ---- */
  .tabbar { flex: none; display: flex; background: var(--panel); border-bottom: 1px solid var(--line); }
  .tabbar button {
    flex: 1; height: 46px; border-radius: 0; background: transparent; color: var(--dim);
    font-weight: 600; border-bottom: 2px solid transparent;
  }
  .tabbar button { font-size: 13px; }
  main[data-tab="conv"]    .tabbar button[data-go="conv"],
  main[data-tab="lanes"]   .tabbar button[data-go="lanes"],
  main[data-tab="deploys"] .tabbar button[data-go="deploys"] { color: var(--txt); border-bottom-color: var(--accent); }

  /* ---- main (mobile-first: one panel at a time via tabs) ---- */
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .panels { flex: 1; min-height: 0; display: flex; }
  .col { flex: 1; min-width: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  main[data-tab="conv"]    .col:not(.conv),
  main[data-tab="lanes"]   .col:not(.lanes),
  main[data-tab="deploys"] .col:not(.deploys) { display: none; }

  .panel-head {
    position: sticky; top: 0; background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 9px 14px; display: flex; align-items: center; gap: 10px; z-index: 2;
  }
  .panel-head h2 { font-size: 12px; margin: 0; font-weight: 600; text-transform: uppercase;
    letter-spacing: .6px; color: var(--dim); }
  .filters { margin-left: auto; display: flex; gap: 6px; }
  .filters input {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--txt);
    border-radius: 8px; padding: 0 10px; height: 36px; font: 12px var(--mono);
    width: 92px; min-width: 0;
  }
  .filters button.ghost { height: 36px; padding: 0 12px; }

  .msg { padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .msg.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(91,140,255,.16); } to { background: transparent; } }
  .msg .meta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font: 12px var(--mono); color: var(--dim); }
  .msg .route { color: var(--txt); } .msg .arrow { color: var(--accent); } .msg .type { color: var(--dim); }
  .msg .pri { padding: 0 5px; border-radius: 4px; background: var(--panel-2); font-size: 11px; }
  .msg .pri.P0, .msg .pri.P1 { color: var(--bad); }
  .msg .rr { color: var(--warn); }
  .msg .time { margin-left: auto; }
  .msg .subj { margin-top: 4px; font-weight: 600; line-height: 1.4; }
  .msg .body { margin-top: 3px; color: var(--dim); white-space: pre-wrap; overflow-wrap: anywhere; }

  .lane { padding: 12px 14px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent;
    display: flex; flex-direction: column; gap: 4px; }
  .lane.flag-dark  { border-left-color: var(--bad); background: rgba(255,107,107,.07); }
  .lane.flag-stale { border-left-color: var(--warn); background: rgba(240,180,41,.06); }
  .lane .top { display: flex; align-items: center; gap: 8px; }
  .lane .id { font: 13px var(--mono); }
  .lane .flag {
    font: 11px/1 var(--mono); font-weight: 700; letter-spacing: .3px; padding: 3px 8px;
    border-radius: 9px; text-transform: uppercase;
  }
  .lane .flag.dark  { color: var(--bad);  background: rgba(255,107,107,.14); border: 1px solid rgba(255,107,107,.5); }
  .lane .flag.stale { color: var(--warn); background: rgba(240,180,41,.14); border: 1px solid rgba(240,180,41,.5); }
  .lane .st { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--panel-2); }
  .lane .st.working { color: var(--good); } .lane .st.idle { color: var(--accent); }
  .lane .st.offline, .lane .st.blocked { color: var(--bad); }
  .lane .task { font-size: 12px; color: var(--txt); overflow-wrap: anywhere; }
  .lane .taskage { font: 11px var(--mono); color: var(--dim); }
  .lane .hb { font: 11px var(--mono); }
  .lane .hb.fresh { color: var(--good); } .lane .hb.stale { color: var(--warn); } .lane .hb.dead { color: var(--bad); }
  .lane .desired { font: 11px var(--mono); color: var(--dim); }
  .lane .peek-toggle {
    align-self: flex-start; margin-top: 2px; height: 30px; padding: 0 12px;
    font: 11px var(--mono); font-weight: 600; letter-spacing: .3px; text-transform: uppercase;
  }
  .lane .peek-box {
    display: none; margin-top: 6px; background: #05070c; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 10px; max-height: 50vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch; font: 11px/1.5 var(--mono); color: #9fe8b0;
    white-space: pre-wrap; word-break: break-all;
  }
  .lane .peek-box.open { display: block; }
  .lane.peeking { outline: 1px solid var(--accent, #4ade80); outline-offset: -1px; }
  .lane .peek-box .peek-empty { color: var(--dim); font-style: italic; }
  .empty { padding: 28px 16px; color: var(--dim); font-size: 14px; text-align: center; }

  /* ---- deploys panel ---- */
  .dep { padding: 12px 14px; border-bottom: 1px solid var(--line); border-left: 3px solid transparent;
    display: flex; flex-direction: column; gap: 4px; }
  .dep .top { display: flex; align-items: center; gap: 8px; }
  .dep .ws { font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .dep .stage {
    margin-left: auto; flex: none; font: 11px/1 var(--mono); font-weight: 600;
    text-transform: uppercase; letter-spacing: .4px; padding: 4px 8px; border-radius: 10px;
    background: var(--panel-2); color: var(--dim); border: 1px solid var(--line);
  }
  .dep .stage.live    { color: var(--good); border-color: var(--good); box-shadow: 0 0 6px rgba(62,207,142,.5); }
  .dep .stage.merged  { color: var(--good); border-color: rgba(62,207,142,.5); }
  .dep .stage.in_review { color: var(--warn); border-color: rgba(240,180,41,.55); }
  .dep .stage.pushed  { color: var(--accent); border-color: rgba(91,140,255,.55); }
  .dep .stage.pending { color: var(--dim); }
  .dep .stage.blocked { color: var(--bad); border-color: var(--bad); box-shadow: 0 0 6px rgba(255,107,107,.5); }
  .dep.flag-stalled { border-left: 3px solid var(--warn); background: rgba(240,180,41,.06); }
  .dep .stalled {
    font: 11px/1 var(--mono); font-weight: 700; letter-spacing: .3px; text-transform: uppercase;
    color: var(--warn); background: rgba(240,180,41,.14); border: 1px solid rgba(240,180,41,.5);
    padding: 3px 8px; border-radius: 9px;
  }
  .dep .sub { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font: 12px var(--mono); color: var(--dim); }
  .dep .repo { color: var(--txt); }
  .dep .detail { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; }
  .dep a.url { color: var(--accent); font: 12px var(--mono); text-decoration: none; overflow-wrap: anywhere; }
  .dep a.url:active { opacity: .7; }
  .dep .age { margin-left: auto; }

  /* ---- lane tasks (folded into the Lanes card, was a separate Queue tab) ---- */
  .lane .tasks { margin: 6px -14px 0; border-top: 1px dashed var(--line); }
  .qlane { padding: 10px 14px 5px; font: 11px var(--mono); font-weight: 700; text-transform: uppercase;
    letter-spacing: .5px; color: var(--accent); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .qtask { padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .qtask .top { display: flex; align-items: baseline; gap: 8px; }
  .qtask .rank { font: 11px var(--mono); color: var(--dim); flex: none; min-width: 16px; }
  .qtask .title { font-weight: 600; overflow-wrap: anywhere; }
  .qtask .st { margin-left: auto; flex: none; font: 10px var(--mono); text-transform: uppercase;
    letter-spacing: .4px; padding: 2px 7px; border-radius: 9px; background: var(--panel-2); color: var(--dim); }
  .qtask .st.active  { color: var(--good); border: 1px solid rgba(62,207,142,.5); }
  .qtask .st.blocked { color: var(--warn); border: 1px solid rgba(240,180,41,.5); }
  .qtask .sla { margin-left: auto; flex: none; font: 10px var(--mono); letter-spacing: .3px;
    padding: 2px 7px; border-radius: 9px; background: var(--panel-2); color: var(--dim); }
  .qtask .sla.idle { opacity: .7; }
  .qtask .sla.over { color: var(--bad); font-weight: 700; background: rgba(255,90,90,.12);
    border: 1px solid rgba(255,90,90,.5); }
  .qtask .sla + .st { margin-left: 6px; }
  .qtask.breached { border-left: 2px solid var(--bad); }
  .qtask .detail { font-size: 12px; color: var(--dim); overflow-wrap: anywhere; margin-top: 3px; padding-left: 24px; }

  /* ---- desktop: side-by-side, both panels, no tabs ---- */
  @media (min-width: 760px) {
    body { font-size: 14px; }
    .token-row { width: auto; margin-left: auto; }
    .token-row input { width: 240px; flex: none; height: 34px; }
    button { height: 34px; }
    .tabbar { display: none; }
    /* conv (Messages) spans both rows on the left; lanes (now incl. queue +
       peek, so given more height) + deploys stack in the right column */
    .panels { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 3fr 2fr; }
    .col { display: block !important; overflow: auto; }
    .col.conv    { grid-column: 1; grid-row: 1 / 3; border-right: 1px solid var(--line); }
    .col.lanes   { grid-column: 2; grid-row: 1; border-bottom: 1px solid var(--line); }
    .col.deploys { grid-column: 2; grid-row: 2; }
    .filters input { height: 30px; } .filters button.ghost { height: 30px; }
  }
</style>
</head>
<body>
<header>
  <h1>Fleet Console</h1>
  <span class="conn"><span id="dot" class="dot"></span><span id="connTxt">offline</span></span>
  <a class="navlink" href="/docs">Docs &rarr;</a>
  <a class="navlink" href="/media">Screenshots &rarr;</a>
</header>

<main data-tab="lanes">
  <nav class="tabbar">
    <button data-go="lanes">Lanes</button>
    <button data-go="conv">Messages</button>
    <button data-go="deploys">Deploys</button>
  </nav>
  <div class="panels">
    <section class="col conv">
      <div class="panel-head">
        <h2>Messages</h2>
        <div class="filters">
          <input id="fThread" placeholder="thread" inputmode="numeric" />
          <input id="fAgent" placeholder="agent" autocapitalize="off" autocorrect="off" spellcheck="false" />
          <button class="ghost" id="applyFilters">Filter</button>
        </div>
      </div>
      <div id="messages"><div class="empty">Connecting&hellip;</div></div>
    </section>
    <section class="col lanes">
      <div class="panel-head"><h2>Lanes</h2>
        <button class="ghost" id="refreshLanes" style="margin-left:auto">Refresh</button></div>
      <div id="lanes"><div class="empty">—</div></div>
    </section>
    <section class="col deploys">
      <div class="panel-head"><h2>Deploys</h2>
        <button class="ghost" id="refreshDeploys" style="margin-left:auto">Refresh</button></div>
      <div id="deploys"><div class="empty">—</div></div>
    </section>
  </div>
</main>

<script src="/static/app.js"></script>
<script>
  /* mobile tab toggle (desktop ignores via CSS) */
  (function () {
    var main = document.querySelector('main');
    document.querySelectorAll('.tabbar button').forEach(function (b) {
      b.addEventListener('click', function () { main.setAttribute('data-tab', b.getAttribute('data-go')); });
    });
  })();

  /* PWA service worker: register + reload EXACTLY once when a new worker
     takes control. The guard prevents a refresh loop (its own blank/thrash
     failure distinct from, but as bad as, never updating at all). */
  (function () {
    if (!('serviceWorker' in navigator)) return;
    var refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) {
      console.warn('SW registration failed', e);
    });
  })();
</script>
</body>
</html>
