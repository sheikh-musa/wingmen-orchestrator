<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="color-scheme" content="dark" />
<title>Fleet</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0b0e14" />
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fleet" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<style>
  :root {
    --bg: #0b0e14; --panel: #131722; --panel-2: #1a2030; --line: #232a3a;
    --txt: #d7dce5; --dim: #8a93a6; --accent: #5b8cff; --good: #3ecf8e;
    --warn: #f0b429; --bad: #ff6b6b; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; padding-bottom: 40px;
    padding-top: env(safe-area-inset-top); padding-bottom: calc(env(safe-area-inset-bottom) + 40px);
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  a { color: var(--accent); text-decoration: none; }

  /* pull-to-refresh — the WHOLE element is offset BELOW the notch via
     `top: env(safe-area-inset-top)`, so its band + centered label can never
     render under the notch. The earlier top:0 + padding-top + content-box
     trick still clipped on a real iPhone (operator 2026-07-11): the label
     centered across the padded box drifted back under the inset. Offsetting the
     element's top removes that whole class of box-sizing ambiguity — on desktop
     the inset is 0 so top:0 (unchanged); on iOS it starts exactly at the notch
     edge. A backdrop strip (::before) fills the notch area with the panel bg so
     the pull still reads as one solid sheet, not a floating band. */
  #ptr { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 0; overflow: hidden; pointer-events: none; background: var(--panel);
    color: var(--dim); font: 12px/1 var(--mono); letter-spacing: .3px; white-space: nowrap; }
  /* fill the notch strip above the band (only while pulling) so the sheet is
     continuous; height 0 at rest keeps it invisible when not pulling. */
  #ptr::before { content: ""; position: fixed; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top); background: var(--panel); z-index: 60;
    display: none; }
  #ptr.pulling::before, #ptr.refreshing::before { display: block; }
  #ptr #ptrTxt { white-space: nowrap; }
  #ptr .spin { display: inline-block; transition: transform .15s ease; }
  #ptr.armed { color: var(--accent); } #ptr.armed .spin { transform: rotate(180deg); }
  #ptr.snap { transition: height .2s ease; }
  #ptr.refreshing .spin { animation: ptrspin .7s linear infinite; }
  @keyframes ptrspin { to { transform: rotate(360deg); } }

  /* PULSE */
  .pulse { position: sticky; top: 0; z-index: 5; background: linear-gradient(180deg,#10151f,#0b0e14);
    border-bottom: 1px solid var(--line); padding: 13px 16px 12px; }
  .pulse .brandrow { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .pulse .brand { font-size: 13px; font-weight: 600; letter-spacing:.3px; color: var(--dim); }
  .pulse .brand .live { color: var(--good); } .pulse .brand .live.down { color: var(--bad); }
  /* build badge — always-visible so the operator can SEE which build his device
     is running (PWA-cache-loop fix). .stale (a newer build is deployed than the
     one this cached bundle is) turns it amber until the one-shot reload lands. */
  .pulse .brand .build { font:10px/1 var(--mono); letter-spacing:.3px; color:var(--dim); font-weight:400; }
  .pulse .brand .build.stale { color:var(--warn); }
  /* weekly Max-pool usage, "up top" in the header (op#9770) */
  .poolusage { margin-left:auto; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .poolchip { font:10px/1.4 var(--mono); letter-spacing:.2px; padding:2px 6px; border-radius:6px;
    background:rgba(255,255,255,.05); color:var(--dim); white-space:nowrap; }
  .poolchip b { font-weight:700; }
  .poolchip.good b { color:var(--good); } .poolchip.warn b { color:var(--warn); } .poolchip.bad b { color:var(--bad); }
  .poolchip.bad { background:rgba(240,90,90,.12); }
  .poolchip.stale { color:var(--dim); opacity:.6; } .poolchip.stale b { color:var(--dim); }
  /* Lane worklists — the per-lane drain view (lane_tasks) */
  .qlane { margin-bottom:10px; }
  .qlane-h { font:11px/1.4 var(--mono); text-transform:uppercase; letter-spacing:.6px;
    color:var(--dim); margin:0 0 4px; }
  .qlane-h .qn { color:var(--txt); font-weight:700; }
  .qrow { display:flex; align-items:center; gap:8px; padding:5px 0;
    border-bottom:1px solid var(--line); }
  .qrow:last-child { border-bottom:none; }
  .qtitle { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-size:13px; color:var(--txt); }
  .qchip { flex:none; font:10px/1.4 var(--mono); letter-spacing:.2px; padding:2px 7px;
    border-radius:6px; background:rgba(255,255,255,.05); color:var(--dim); white-space:nowrap; }
  .qchip.queued { color:var(--dim); }
  .qchip.stale { color:var(--warn); background:rgba(240,180,41,.10); }
  .qchip.work { color:var(--good); background:rgba(62,207,142,.12); font-weight:700; }
  .qchip.wait { color:var(--warn); background:rgba(240,180,41,.14); font-weight:700; }
  .qchip.over { color:var(--bad); background:rgba(255,107,107,.14); font-weight:700; }
  .pulse .headline { display:flex; align-items:center; gap:11px; }
  .pulse .orb { width:12px; height:12px; border-radius:50%; flex:none; background: var(--dim); }
  .pulse.attn .orb { background: var(--warn); box-shadow:0 0 0 4px rgba(240,180,41,.16), 0 0 12px var(--warn); animation:breathe 2.4s ease-in-out infinite; }
  .pulse.clear .orb { background: var(--good); box-shadow:0 0 0 4px rgba(62,207,142,.14), 0 0 10px var(--good); }
  @keyframes breathe { 0%,100%{opacity:.6} 50%{opacity:1} }
  .pulse .big { font-size: 20px; font-weight: 700; letter-spacing:.2px; }
  .pulse.attn .big { color: #ffd77a; } .pulse.clear .big { color: var(--good); }
  /* Glance banner: the top-3 worst-offender context-bloat lanes. Each pct is
     color-coded by ITS OWN green/amber/red level; the leading dot shows the worst
     lane's level. Wraps on a narrow phone. Hidden until renderTopBloat adds .show. */
  .topbloat { display:none; align-items:center; flex-wrap:wrap; gap:4px 7px; margin-top:10px;
    font:12px/1.2 var(--mono); padding:6px 10px; border-radius:8px;
    background: rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); }
  .topbloat.show { display:flex; }
  .topbloat .dot { width:8px; height:8px; border-radius:50%; flex:none; }
  .topbloat .lbl { color:var(--dim); }
  .topbloat .ent { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
  .topbloat .who { color:var(--txt); font-weight:700; }
  .topbloat .pct { font-weight:700; }
  .topbloat .sep { color:var(--dim); }
  .topbloat .dot.green{background:var(--good)} .topbloat .pct.green{color:var(--good)}
  .topbloat .dot.amber{background:var(--warn)} .topbloat .pct.amber{color:var(--warn)}
  .topbloat .dot.red{background:var(--bad)}    .topbloat .pct.red{color:var(--bad)}
  .strip { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; gap:6px; font:12px/1 var(--mono);
    padding:7px 11px; border-radius:999px; background: var(--panel-2); border:1px solid var(--line); color: var(--dim); }
  .chip b { color: var(--txt); font-weight:700; }
  .chip .d { width:7px; height:7px; border-radius:50%; }
  .chip .d.good{background:var(--good)} .chip .d.dim{background:var(--dim)} .chip .d.bad{background:var(--bad)}

  section { padding: 0 16px; }
  .sec-h { display:flex; align-items:center; gap:8px; margin: 20px 2px 10px; }
  .sec-h h2 { font-size: 11px; margin:0; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color: var(--dim); }
  .sec-h .count { font:11px var(--mono); color:var(--dim); }
  .sec-h.needs h2 { color: var(--warn); }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 2px 2px; }

  /* NEEDS YOU */
  .need { display:flex; gap:12px; align-items:flex-start; padding:13px 14px; margin-bottom:9px;
    background: linear-gradient(180deg, rgba(240,180,41,.08), rgba(240,180,41,.03));
    border:1px solid rgba(240,180,41,.32); border-radius:14px; }
  .need.crit { background: linear-gradient(180deg, rgba(255,107,107,.09), rgba(255,107,107,.03)); border-color: rgba(255,107,107,.4); }
  .need .ico { width:30px; height:30px; border-radius:9px; flex:none; display:flex; align-items:center; justify-content:center;
    font-size:15px; background: rgba(240,180,41,.16); }
  .need.crit .ico { background: rgba(255,107,107,.16); }
  .need .m { min-width:0; flex:1; }
  .need .k { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .need .who { font:12px var(--mono); color:var(--txt); font-weight:600; }
  .need .tag { font:10px/1 var(--mono); text-transform:uppercase; letter-spacing:.4px; padding:3px 7px; border-radius:8px;
    background: rgba(240,180,41,.16); color:var(--warn); font-weight:700; }
  .need.crit .tag { background: rgba(255,107,107,.16); color:var(--bad); }
  .need .age { margin-left:auto; font:11px var(--mono); color:var(--dim); }
  .need .what { margin-top:4px; font-size:13.5px; color:var(--txt); line-height:1.4; overflow-wrap:anywhere; }
  /* A needs-you row is tappable ONLY when it maps to a real lane (jump to that
     lane + open its peek); the chevron/cursor is shown only then, so the
     affordance never promises a destination that isn't there. */
  .need.tappable { cursor:pointer; }
  .need.tappable:active { transform:scale(.995); }
  /* "peek ›" — the tap opens the lane's live peek (watch), it is NOT a reply
     affordance; kept small + mono so it reads as an action label, not a chevron. */
  .need .go { align-self:center; flex:none; margin-left:2px; color:var(--accent);
    font:11px/1 var(--mono); white-space:nowrap; }
  /* "Fleet is handling" rows: hub-owned, not the operator's to answer — dimmed
     and never crit-red so they don't read as demanding his response. */
  .need.handling { opacity:.72; border-color: var(--line); background: var(--panel-2); }
  .need.handling .who { color: var(--dim); }
  .need.handling .what { color: var(--dim); }

  /* lanes */
  .lane { padding:12px 14px; margin-bottom:9px; background: var(--panel); border:1px solid var(--line);
    border-radius:13px; border-left:3px solid transparent; }
  .lane.flag { border-left-color: var(--bad); background: linear-gradient(90deg, rgba(255,107,107,.06), var(--panel) 40%); }
  .lane[data-peek] { cursor: pointer; }
  .lane .top { display:flex; align-items:center; gap:9px; }
  .lane .st-dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .st-dot.working{background:var(--good); box-shadow:0 0 7px var(--good)} .st-dot.idle{background:var(--dim)} .st-dot.offline{background:var(--bad)}
  .lane .id { font:13px var(--mono); font-weight:600; overflow-wrap:anywhere; }
  .lane .badge { font:10px/1 var(--mono); font-weight:700; text-transform:uppercase; letter-spacing:.4px; padding:3px 8px; border-radius:8px;
    color:var(--bad); background:rgba(255,107,107,.14); border:1px solid rgba(255,107,107,.5); }
  .lane .state { margin-left:auto; font:11px var(--mono); flex:none; }
  .state.working{color:var(--good)} .state.idle{color:var(--dim)} .state.offline{color:var(--bad)}
  .lane .act { margin-top:7px; font-size:13.5px; line-height:1.4; overflow-wrap:anywhere; color: var(--txt); }
  .lane .meta { margin-top:8px; display:flex; gap:12px; font:11px var(--mono); color:var(--dim); flex-wrap:wrap; align-items:center; }
  .lane .meta .hb.fresh{color:var(--good)} .lane .meta .hb.stale{color:var(--warn)} .lane .meta .hb.dead{color:var(--bad)}
  .lane .meta .tap { margin-left:auto; color:var(--accent); }
  .lane .meta .reset-btn { margin-left:auto; font:10px/1 var(--mono); letter-spacing:.3px;
    color:var(--bad); background:rgba(255,107,107,.10); border:1px solid rgba(255,107,107,.30);
    padding:4px 8px; border-radius:7px; cursor:pointer; -webkit-appearance:none; transition:background .12s; }
  .lane .meta .tap + .reset-btn { margin-left:8px; }
  .lane .meta .reset-btn:hover { background:rgba(255,107,107,.18); }
  .lane .meta .reset-btn:active { transform:scale(.96); }
  .lane .meta .reset-btn:disabled { opacity:.6; cursor:default; }
  .lane .meta .reset-btn.arm { color:#fff; background:rgba(255,107,107,.32); border-color:rgba(255,107,107,.6); }
  /* Lane OAuth-account switch control (token-pool conservation) — accent (benign
     account swap), distinct from the red reset. Sits at the right of the meta row. */
  .lane .meta .switch-ctl { margin-left:auto; display:inline-flex; align-items:center; gap:6px; }
  .lane .meta .tap + .switch-ctl, .lane .meta .reset-btn + .switch-ctl { margin-left:8px; }
  .lane .meta .switch-ctl .tok-sel { font:10px/1 var(--mono); color:var(--txt); background:var(--panel);
    border:1px solid var(--line); border-radius:7px; padding:4px 6px; -webkit-appearance:none; cursor:pointer; }
  .lane .meta .switch-ctl .switch-btn { font:10px/1 var(--mono); letter-spacing:.3px;
    color:var(--good); background:rgba(62,207,142,.10); border:1px solid rgba(62,207,142,.30);
    padding:4px 8px; border-radius:7px; cursor:pointer; -webkit-appearance:none; transition:background .12s; }
  .lane .meta .switch-ctl .switch-btn:hover { background:rgba(62,207,142,.18); }
  .lane .meta .switch-ctl .switch-btn:active { transform:scale(.96); }
  .lane .meta .switch-ctl .switch-btn:disabled { opacity:.6; cursor:default; }
  .lane .meta .switch-ctl .switch-btn.arm { color:#fff; background:rgba(251,191,36,.32); border-color:rgba(251,191,36,.6); }
  .collapsed { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--panel);
    border:1px dashed var(--line); border-radius:13px; color:var(--dim); font-size:13px; cursor:pointer; }
  .collapsed b { color:var(--txt); white-space:nowrap; }

  /* readable peek */
  .peek { margin-top:10px; background:#0a0d13; border:1px solid var(--line); border-radius:11px; overflow:hidden; display:none; }
  .peek.open { display:block; }
  .peek .ph { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); font:11px var(--mono); color:var(--dim); }
  .peek .ph .raw { margin-left:auto; color:var(--accent); cursor:pointer; }
  .peek .body { max-height:46vh; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 0; }
  /* Flowing, borderless lines: each pane line wraps as a whole paragraph so a
     long line stays readable at 430px instead of breaking into boxed shards. */
  .peek .ln { padding:2px 14px; font-size:13px; line-height:1.5; overflow-wrap:anywhere; white-space:pre-wrap; color:var(--txt); }
  .peek .ln.now { color:#bcd0ff; box-shadow:inset 3px 0 0 var(--accent); }
  .peek .raw-pre { margin:0; padding:10px 12px; white-space:pre-wrap; word-break:break-word; font:11px/1.5 var(--mono); color:#9fe8b0; }
  .peek .peek-empty { padding:10px 12px; color:var(--dim); font-style:italic; }

  /* deploys */
  .depstrip { display:flex; gap:8px; overflow-x:auto; padding:2px 0 4px; -webkit-overflow-scrolling:touch; }
  .dep { flex:none; padding:9px 12px; border-radius:11px; background:var(--panel); border:1px solid var(--line); min-width:150px; }
  .dep .ws { font-size:12.5px; font-weight:600; overflow-wrap:anywhere; }
  .dep .stg { margin-top:5px; font:10px/1 var(--mono); text-transform:uppercase; letter-spacing:.4px; color:var(--dim); }
  .dep.live .stg{color:var(--good)} .dep.blocked .stg{color:var(--bad)} .dep.in_review .stg{color:var(--warn)} .dep.merged .stg{color:var(--good)} .dep.pushed .stg{color:var(--accent)}
  .dep .rp { margin-top:5px; font:11px var(--mono); color:var(--dim); }
  .dep a { display:block; margin-top:4px; font:11px var(--mono); overflow-wrap:anywhere; }

  /* backlog — the operator's realtime "Your asks" tracker (swipe: → top · ← drop) */
  .blhint { margin-left:auto; font:10px/1 var(--mono); color:var(--dim); letter-spacing:.3px; white-space:nowrap; }
  .bl-row { position:relative; margin-bottom:8px; border-radius:12px; overflow:hidden; }
  .bl-row.dropping { opacity:.35; transition:opacity .18s ease; }
  .bl-act { position:absolute; top:0; bottom:0; display:flex; align-items:center;
    font:11px/1 var(--mono); font-weight:700; text-transform:uppercase; letter-spacing:.6px; }
  .bl-act.top  { left:0;  width:58%; justify-content:flex-start; padding-left:16px;  color:var(--good); background:rgba(62,207,142,.14); }
  .bl-act.drop { right:0; width:58%; justify-content:flex-end;   padding-right:16px; color:var(--bad);  background:rgba(255,107,107,.14); }
  .bl-row.armtop  .bl-act.top  { background:rgba(62,207,142,.32); }
  .bl-row.armdrop .bl-act.drop { background:rgba(255,107,107,.32); }
  .bl { position:relative; z-index:2; display:flex; gap:10px; align-items:flex-start; padding:11px 13px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    touch-action:pan-y; transition:transform .18s ease; will-change:transform; cursor:grab; }
  .bl:active { cursor:grabbing; }
  .bl .bltag { flex:none; font:10px/1 var(--mono); font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    padding:4px 8px; border-radius:8px; white-space:nowrap; margin-top:1px; }
  .bl .bltag.wait { color:var(--bad); background:rgba(255,107,107,.14); }
  .bl .bltag.prog { color:var(--warn); background:rgba(240,180,41,.14); }
  .bl .bltag.done { color:var(--good); background:rgba(62,207,142,.14); }
  .bl .bltag.park { color:var(--dim); background:rgba(138,147,166,.14); }
  .bl .blbody { min-width:0; flex:1; }
  .bl .blask { font-weight:600; font-size:13.5px; overflow-wrap:anywhere; }
  .bl .bldone { color:var(--good); font-size:12px; margin-top:4px; line-height:1.35; overflow-wrap:anywhere;
    background:rgba(62,207,142,.10); border-left:2px solid rgba(62,207,142,.5); padding:3px 8px; border-radius:5px; }
  .bl .blnote { color:var(--dim); font-size:12.5px; margin-top:3px; line-height:1.4; overflow-wrap:anywhere; }
  .bl .blop { color:var(--dim); font:11px var(--mono); margin-top:4px; }

  /* per-lane context gauge — the former "Context bloat" section, now FOLDED
     into each lane card so a lane's status + its /1M window fill read together
     in one list (unified-lanes redesign). The classes stay context-neutral
     (.bar/.fill/.ctxpct/.ctxmeta) so the gauge renders inside .lane cards. */
  .lanectx { margin-top:9px; }
  .bar { height:7px; border-radius:999px; background:var(--panel-2); overflow:hidden; }
  .bar .fill { height:100%; border-radius:999px; }
  .bar .fill.green{background:var(--good)} .bar .fill.amber{background:var(--warn)} .bar .fill.red{background:var(--bad)}
  .ctxpct { font:11px var(--mono); font-weight:700; }
  .ctxpct.green{color:var(--good)} .ctxpct.amber{color:var(--warn)} .ctxpct.red{color:var(--bad)}
  .ctxmeta { margin-top:6px; font:11px var(--mono); color:var(--dim); }
  .ctxmeta .staler { color:var(--warn); }

  /* token / auth */
  .tok { display:flex; align-items:center; gap:9px; padding:10px 14px; margin-bottom:7px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; flex-wrap:wrap; }
  .tok .tdot { width:9px; height:9px; border-radius:50%; flex:none; }
  .tok .tdot.good{background:var(--good); box-shadow:0 0 7px var(--good)} .tok .tdot.bad{background:var(--bad); box-shadow:0 0 7px var(--bad)}
  .tok .tsess { font:12.5px var(--mono); font-weight:600; overflow-wrap:anywhere; }
  .tok .tbadge { font:10px/1 var(--mono); text-transform:uppercase; letter-spacing:.4px; padding:3px 8px; border-radius:8px; font-weight:700; }
  .tok .tbadge.good{color:var(--good); background:rgba(62,207,142,.14)} .tok .tbadge.bad{color:var(--bad); background:rgba(255,107,107,.14)}
  .tok .tacct { margin-left:auto; font:11px var(--mono); color:var(--dim); }
  #tokenSummary b.good{color:var(--good)} #tokenSummary b.bad{color:var(--bad)}

  .feednote { color:var(--dim); font-size:12.5px; padding: 2px 2px 0; }
  .lane.coord { border-left:3px solid var(--accent); background: linear-gradient(90deg, rgba(91,140,255,.07), var(--panel) 42%); }
  .state.coordrole { color: var(--accent); text-transform:none; font-weight:600; }
  .act.coordidle { color: var(--dim); }
  /* per-coordinator context readout (op#9088) — lives in the card's meta row */
  .lane.coord .meta .cctx { font:11px var(--mono); font-weight:700; }
  .lane.coord .meta .cctx.green{color:var(--good)} .lane.coord .meta .cctx.amber{color:var(--warn)} .lane.coord .meta .cctx.red{color:var(--bad)}
</style>
</head>
<body>
<div id="ptr"><span class="spin">&darr;</span><span id="ptrTxt">Pull to refresh</span></div>
<div class="wrap">

  <div id="pulse" class="pulse">
    <div class="brandrow">
      <span class="brand">Fleet <span id="liveDot" class="live">● live</span> <span id="build" class="build" title="build running on this device"></span></span>
      <span id="poolUsage" class="poolusage" title="Max weekly-pool usage (op#9770)"></span>
    </div>
    <div class="headline"><span class="orb"></span><span id="pulseBig" class="big">Loading…</span></div>
    <!-- Glance: the single most context-bloated worker lane (operator ask, op#10550
         follow-up). Display-only, from the existing context_bloat payload; hidden
         when there is no reading. Coordinators are NOT lanes (own cards) so they're
         excluded, same as the per-card gauges. -->
    <div id="topBloat" class="topbloat"></div>
    <div id="strip" class="strip"></div>
  </div>

  <section>
    <div class="sec-h needs"><h2>Needs you</h2><span id="needsCount" class="count"></span></div>
    <div id="needs"></div>
  </section>

  <section>
    <div class="sec-h"><h2>Your asks</h2><span id="backlogCount" class="count"></span></div>
    <div id="backlog"><div class="empty">Loading…</div></div>
  </section>

  <section>
    <div class="sec-h"><h2>Coordinators</h2><span class="count">hub · console · cai</span></div>
    <div id="coordinators"><div class="empty">Loading…</div></div>
  </section>

  <!-- "Context bloat" section removed (unified-lanes redesign): each worker
       lane's /1M window gauge now renders INSIDE its own lane card below, so
       status + context read together in one list. -->

  <section id="handlingSec" style="display:none">
    <div class="sec-h"><h2>Fleet is handling</h2><span class="count">hub owns these · tap to peek</span><span id="handlingCount" class="count"></span></div>
    <div id="handling"></div>
  </section>

  <section>
    <div class="sec-h"><h2>Lanes</h2><span class="count">working first · /1M window fill</span></div>
    <div id="lanes"><div class="empty">Loading…</div></div>
  </section>

  <section>
    <div class="sec-h"><h2>Lane worklists</h2><span class="count">what each lane is draining</span></div>
    <div id="laneQueues"><div class="empty">Loading…</div></div>
  </section>

  <!-- Deploys + Feed sections removed per operator (op#9888): low-signal at the
       bottom; deploy_status + raw bus live on the hub, not this attention-first view. -->

</div>
<script src="/static/fleet.js"></script>
<script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    // ONE-SHOT reload when a new SW takes control, so a fresh deploy lands in a
    // SINGLE reopen (kills the iOS 2-launch update lag). Guarded so it can NEVER
    // infinite-loop (the exact failure the sw.js header warns about):
    //   - the guard is in sessionStorage, which SURVIVES the reload — an
    //     in-memory bool (the old code) resets on the new page and can re-fire;
    //   - we only reload on a real UPDATE (a controller already existed), never
    //     on the first-install claim (which would reload every first visit).
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) return;                                // first install, not an update
      if (sessionStorage.getItem('fleet_sw_reloaded')) return;  // already reloaded this session
      sessionStorage.setItem('fleet_sw_reloaded', '1');
      window.location.reload();
    });
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function(){});
  })();
</script>
</body>
</html>
