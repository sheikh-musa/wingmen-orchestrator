<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="color-scheme" content="dark" />
<title>Fleet</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0b0e14" />
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fleet" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<style>
  :root {
    /* Calm Command palette (fc-v38 ihsan redesign, carried into the fc-v50
       Command-Surface unification). Jade = all-clear; warm tones only where
       attention is due. SF Pro carries structure; mono is data-only. */
    --bg: #090b10; --panel: #12161e; --panel-2: #171c26; --panel-3: #1d2430;
    --line: rgba(255,255,255,.07); --line-2: rgba(255,255,255,.10);
    --txt: #e8ebf1; --dim: #949cac; --faint: #5c6472;
    --accent: #8aa6ff; --good: #37d39a; --good-dim: #1f9e77;
    --warn: #f6c453; --bad: #fb7185;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    --shadow: 0 1px 0 rgba(255,255,255,.045) inset, 0 10px 30px -12px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow-x: hidden; }
  body {
    color: var(--txt);
    font: 15px/1.5 var(--sans); letter-spacing: -.01em; -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 60% at 50% -6%, rgba(55,211,154,.06), transparent 60%),
      radial-gradient(90% 46% at 50% 0%, rgba(138,166,255,.05), transparent 55%),
      linear-gradient(180deg, #0c0f16, var(--bg) 42%);
    background-attachment: fixed;
    -webkit-text-size-adjust: 100%;
    /* leave room for the resting dock so the last lane isn't hidden under it */
    padding-bottom: calc(env(safe-area-inset-bottom) + 78px);
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  a { color: var(--accent); text-decoration: none; }

  /* pull-to-refresh — offset BELOW the notch via top:env(safe-area-inset-top).
     Unchanged from the fc-v49 dashboard (operator-verified on a real iPhone). */
  #ptr { position: fixed; top: env(safe-area-inset-top); left: 0; right: 0; z-index: 60;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 0; overflow: hidden; pointer-events: none; background: var(--panel);
    color: var(--dim); font: 12px/1 var(--mono); letter-spacing: .3px; white-space: nowrap; }
  #ptr::before { content: ""; position: fixed; top: 0; left: 0; right: 0;
    height: env(safe-area-inset-top); background: var(--panel); z-index: 60; display: none; }
  #ptr.pulling::before, #ptr.refreshing::before { display: block; }
  #ptr #ptrTxt { white-space: nowrap; }
  #ptr .spin { display: inline-block; transition: transform .15s ease; }
  #ptr.armed { color: var(--accent); } #ptr.armed .spin { transform: rotate(180deg); }
  #ptr.snap { transition: height .2s ease; }
  #ptr.refreshing .spin { animation: ptrspin .7s linear infinite; }
  @keyframes ptrspin { to { transform: rotate(360deg); } }

  /* island-fill backdrop (unchanged) so the sticky header never renders under the notch. */
  body::before { content:""; position: fixed; top:0; left:0; right:0;
    height: env(safe-area-inset-top); background:#10151f; z-index: 6; pointer-events:none; }

  /* ── compact command strip — the ambient monitoring frame ── */
  header.pulse { position: sticky; top: env(safe-area-inset-top); z-index: 20;
    background: linear-gradient(180deg, rgba(16,21,31,.97), rgba(11,14,20,.82));
    backdrop-filter: saturate(140%) blur(14px); -webkit-backdrop-filter: saturate(140%) blur(14px);
    border-bottom: 1px solid var(--line); padding: 12px 16px 11px; }
  .pulse .top { display: flex; align-items: center; gap: 10px; }
  .pulse .orb { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--dim); }
  .pulse.attn .orb { background: var(--warn); box-shadow: 0 0 0 4px rgba(240,180,41,.16), 0 0 12px var(--warn); animation: breathe 2.4s ease-in-out infinite; }
  .pulse.clear .orb { background: var(--good); box-shadow: 0 0 0 4px rgba(62,207,142,.14), 0 0 10px var(--good); }
  @keyframes breathe { 0%,100%{opacity:.6} 50%{opacity:1} }
  .pulse .hl { font: 800 17px/1.1 var(--sans); letter-spacing: -.02em; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pulse.attn .hl { color: #ffd77a; } .pulse.clear .hl { color: var(--good); }
  .pulse .live { flex: none; font: 10px/1 var(--mono); color: var(--good); white-space: nowrap; }
  .pulse .live.down { color: var(--bad); }
  /* build badge — always-visible so the operator SEES which build his device runs. */
  .pulse .build { flex: none; white-space: nowrap; font: 9.5px/1 var(--mono); letter-spacing: .3px;
    color: var(--faint); padding: 4px 8px; border-radius: 999px; background: var(--panel);
    border: 1px solid var(--line); }
  .pulse .build.stale { color: var(--warn); border-color: rgba(246,196,83,.3); }

  /* 4-cell stat row — the whole fleet's shape, always above the fold. */
  .stat { display: flex; gap: 5px; margin-top: 10px; }
  .stat .s { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 6px; text-align: center; }
  .stat .s .n { font: 800 17px/1 var(--sans); }
  .stat .s .l { margin-top: 3px; font: 9px/1 var(--mono); color: var(--faint); text-transform: uppercase; letter-spacing: .06em; }
  .stat .s.work .n { color: var(--good); } .stat .s.idle .n { color: var(--dim); }
  .stat .s.off .n { color: var(--bad); } .stat .s.bloat .n { color: var(--warn); }

  /* pool-usage chips (op#9770 / op#12617). Compact single-row chips + pace tooltip. */
  .pools { display: flex; flex-direction: column; gap: 5px; margin-top: 9px; }
  .pools:empty { display: none; }
  .poolrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 10px/1.4 var(--mono); letter-spacing: .2px; }
  .poolchip { flex: none; font: 10px/1.3 var(--mono); padding: 3px 8px; border-radius: 999px;
    background: rgba(255,255,255,.04); border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .poolchip b { font-weight: 700; }
  .poolchip.good b { color: var(--good); } .poolchip.warn b { color: var(--warn); } .poolchip.bad b { color: var(--bad); }
  .poolchip.bad { background: rgba(251,113,133,.1); border-color: rgba(251,113,133,.28); }
  .poolchip.stale { color: var(--dim); opacity: .6; } .poolchip.stale b { color: var(--dim); }
  .pooladv { color: var(--faint); white-space: nowrap; }
  .poolrun { color: var(--dim); white-space: nowrap; } .poolrun.warn { color: var(--warn); }

  /* top-bloat glance (op#18542) — worst offenders across the whole fleet. */
  .topbloat { display: none; align-items: center; flex-wrap: wrap; gap: 4px 7px; margin-top: 9px;
    font: 11px/1.2 var(--mono); padding: 6px 10px; border-radius: 8px;
    background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06); }
  .topbloat.show { display: flex; }
  .topbloat .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .topbloat .lbl { color: var(--dim); }
  .topbloat .ent { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .topbloat .who { color: var(--txt); font-weight: 700; } .topbloat .pct { font-weight: 700; }
  .topbloat .sep { color: var(--dim); }
  .topbloat .dot.green{background:var(--good)} .topbloat .pct.green{color:var(--good)}
  .topbloat .dot.amber{background:var(--warn)} .topbloat .pct.amber{color:var(--warn)}
  .topbloat .dot.red{background:var(--bad)}    .topbloat .pct.red{color:var(--bad)}

  /* ── pinned needs-you callouts (compact) ── */
  .needstrip { padding: 11px 16px 2px; }
  .needstrip:empty { display: none; }
  .need { display: flex; gap: 9px; align-items: center; padding: 10px 12px; margin-bottom: 7px; border-radius: 12px;
    background: linear-gradient(180deg, rgba(240,180,41,.09), rgba(240,180,41,.03)); border: 1px solid rgba(240,180,41,.34);
    box-shadow: var(--shadow); }
  .need.crit { background: linear-gradient(180deg, rgba(255,107,107,.1), rgba(255,107,107,.03)); border-color: rgba(255,107,107,.42); }
  .need.handling { opacity: .72; border-color: var(--line); background: var(--panel-2); }
  .need .m { min-width: 0; flex: 1; }
  .need .who { font: 700 12.5px/1.2 var(--sans); }
  .need .what { margin-top: 2px; font: 11.5px/1.3 var(--sans); color: var(--dim); overflow-wrap: anywhere; }
  .need .tag { flex: none; font: 9px/1 var(--mono); font-weight: 700; text-transform: uppercase;
    padding: 4px 7px; border-radius: 7px; background: rgba(246,196,83,.16); color: var(--warn); }
  .need.crit .tag { background: rgba(255,107,107,.16); color: var(--bad); }
  .need .age { flex: none; font: 10px/1 var(--mono); color: var(--faint); }
  .need.tappable { cursor: pointer; } .need.tappable:active { transform: scale(.995); }
  .need.handling .who { color: var(--dim); } .need.handling .what { color: var(--dim); }

  /* ── LANE SPINE — the dense grid that IS the page ── */
  .spinehead { display: flex; align-items: center; gap: 8px; padding: 14px 16px 8px; }
  .spinehead h2 { font: 800 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 0; }
  .spinehead .count { font: 10px/1 var(--mono); color: var(--faint); }
  .spinehead .ms { margin-left: auto; font: 10px/1 var(--mono); color: var(--accent); padding: 7px 11px; border-radius: 999px;
    background: rgba(138,166,255,.12); border: 1px solid rgba(138,166,255,.28); cursor: pointer; -webkit-appearance: none; }
  .spinehead .ms.on { color: #06231a; background: linear-gradient(160deg, var(--accent), #5a6fd0); border-color: transparent; }
  .grid { padding: 0 16px; }
  .tile { display: flex; align-items: center; gap: 11px; padding: 11px 13px; margin-bottom: 7px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 13px; box-shadow: var(--shadow); border-left: 3px solid transparent;
    cursor: pointer; position: relative; }
  .tile.working { border-left-color: rgba(55,211,154,.55); }
  .tile.bloat { border-left-color: var(--bad); background: linear-gradient(90deg, rgba(255,107,107,.05), var(--panel) 44%); }
  .tile.idle { border-left-color: var(--faint); } .tile.offline { border-left-color: var(--bad); }
  .tile.sel { border-color: rgba(138,166,255,.6); box-shadow: 0 0 0 1px rgba(138,166,255,.4), var(--shadow); }
  .tile.picked { border-color: rgba(138,166,255,.75); background: linear-gradient(90deg, rgba(138,166,255,.12), var(--panel) 50%); }
  /* context ring */
  .ring { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; position: relative; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring .rp { font: 9px/1 var(--mono); font-weight: 700; }
  .ring.green .rp { color: var(--good); } .ring.amber .rp { color: var(--warn); } .ring.red .rp { color: var(--bad); }
  .ring .ck { position: absolute; inset: 0; display: grid; place-items: center; font: 700 15px/1 var(--sans); color: var(--accent); }
  .tile .idw { min-width: 0; flex: 1; }
  .tile .id { font: 700 13.5px/1 var(--sans); display: flex; align-items: center; gap: 7px; overflow-wrap: anywhere; }
  .stdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .stdot.working { background: var(--good); box-shadow: 0 0 6px var(--good); } .stdot.idle { background: var(--dim); }
  .stdot.offline { background: var(--bad); }
  .tile .act { margin-top: 4px; font: 11px/1.25 var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .badge { flex: none; font: 9px/1 var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    padding: 3px 6px; border-radius: 7px; color: var(--bad); background: rgba(255,107,107,.14); border: 1px solid rgba(255,107,107,.5); }
  .tile .tok { flex: none; font: 9px/1 var(--mono); font-weight: 700; padding: 4px 7px; border-radius: 999px; white-space: nowrap; }
  .tok.musa { color: #4ade80; background: rgba(55,211,154,.1); } .tok.musa2 { color: #7dd3fc; background: rgba(125,211,252,.1); }
  .tok.syed { color: #fbbf24; background: rgba(246,196,83,.12); } .tok.other { color: #94a3b8; background: rgba(148,163,184,.12); }
  .tile .chev { flex: none; color: var(--faint); font-size: 12px; }

  .collapsed { display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin: 0 16px 7px; background: var(--panel);
    border: 1px dashed var(--line); border-radius: 13px; color: var(--dim); font-size: 13px; cursor: pointer; }
  .collapsed b { color: var(--txt); white-space: nowrap; }

  /* coordinators as a compact chip row (tap → sheet, peek + recycle where allowed) */
  .coordrow { display: flex; gap: 6px; padding: 2px 16px 4px; flex-wrap: wrap; }
  .cchip { flex: 1 1 30%; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-left: 2px solid var(--accent);
    border-radius: 10px; padding: 8px 9px; cursor: pointer; }
  .cchip .cn { font: 700 11px/1 var(--sans); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cchip .cc { margin-top: 4px; font: 9px/1 var(--mono); font-weight: 700; color: var(--dim); }
  .cchip .cc.green { color: var(--good); } .cchip .cc.amber { color: var(--warn); } .cchip .cc.red { color: var(--bad); }

  /* backlog "Your asks" — collapsible + swipe (unchanged behaviour) */
  section { padding: 0 16px; }
  .sec-h { display: flex; align-items: center; gap: 8px; margin: 18px 2px 10px; }
  .sec-h h2 { font: 800 11px/1 var(--sans); text-transform: uppercase; letter-spacing: .12em; color: var(--faint); margin: 0; }
  .sec-h .count { font: 11px var(--mono); color: var(--dim); }
  .empty { color: var(--dim); font-size: 13px; padding: 6px 2px 2px; }
  .blhint { margin-left: auto; font: 10px/1 var(--mono); color: var(--dim); letter-spacing: .3px; white-space: nowrap; }
  .bl-row { position: relative; margin-bottom: 8px; border-radius: 12px; overflow: hidden; }
  .bl-row.dropping { opacity: .35; transition: opacity .18s ease; }
  .bl-act { position: absolute; top: 0; bottom: 0; display: flex; align-items: center;
    font: 11px/1 var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: .6px; }
  .bl-act.top  { left: 0;  width: 58%; justify-content: flex-start; padding-left: 16px;  color: var(--good); background: rgba(62,207,142,.14); }
  .bl-act.drop { right: 0; width: 58%; justify-content: flex-end;   padding-right: 16px; color: var(--bad);  background: rgba(255,107,107,.14); }
  .bl-row.armtop  .bl-act.top  { background: rgba(62,207,142,.32); }
  .bl-row.armdrop .bl-act.drop { background: rgba(255,107,107,.32); }
  .bl { position: relative; z-index: 2; display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
    touch-action: pan-y; transition: transform .18s ease; will-change: transform; cursor: grab; }
  .bl:active { cursor: grabbing; }
  .bl .bltag { flex: none; font: 10px/1 var(--mono); font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    padding: 4px 8px; border-radius: 8px; white-space: nowrap; margin-top: 1px; }
  .bl .bltag.wait { color: var(--bad); background: rgba(255,107,107,.14); }
  .bl .bltag.prog { color: var(--warn); background: rgba(240,180,41,.14); }
  .bl .bltag.done { color: var(--good); background: rgba(62,207,142,.14); }
  .bl .bltag.park { color: var(--dim); background: rgba(138,147,166,.14); }
  .bl .blbody { min-width: 0; flex: 1; }
  .bl .blask { font: 600 13.5px/1.35 var(--sans); overflow-wrap: anywhere; }
  .bl .bldone { color: var(--good); font-size: 12px; margin-top: 4px; line-height: 1.35; overflow-wrap: anywhere;
    background: rgba(62,207,142,.10); border-left: 2px solid rgba(62,207,142,.5); padding: 3px 8px; border-radius: 5px; }
  .bl .blnote { color: var(--dim); font-size: 12.5px; margin-top: 3px; line-height: 1.4; overflow-wrap: anywhere; }
  .bl .blop { color: var(--dim); font: 11px var(--mono); margin-top: 4px; }

  /* footer: the full lane manager (add-token, remote bodies) + scoped irsyad stay one tap away */
  .footlinks { display: flex; gap: 8px; padding: 16px 16px 6px; }
  .footlinks a { flex: 1; text-align: center; padding: 12px 10px; border-radius: 11px; font: 600 12.5px/1 var(--sans);
    color: var(--dim); background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  .footlinks a:active { background: var(--panel-2); }

  /* ── BOTTOM ACTION DOCK — resting state ── */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    padding: 11px 16px calc(11px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(16,21,31,.4), rgba(9,11,16,.96) 40%);
    backdrop-filter: saturate(140%) blur(16px); -webkit-backdrop-filter: saturate(140%) blur(16px);
    border-top: 1px solid var(--line-2); }
  .dock .dinner { max-width: 720px; margin: 0 auto; width: 100%; display: flex; align-items: center; gap: 9px; }
  .dock .dhint { font: 11px/1.3 var(--mono); color: var(--faint); flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dock .dhint b { color: var(--dim); }
  .dock .dsel { flex: 0 1 auto; min-width: 0; font: 11px/1 var(--mono); color: var(--txt); background: var(--panel-2);
    border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 10px; -webkit-appearance: none; display: none; }
  .dock .dbtn { flex: none; font: 11px/1 var(--sans); font-weight: 700; color: var(--accent); padding: 9px 13px; border-radius: 999px;
    background: rgba(138,166,255,.12); border: 1px solid rgba(138,166,255,.3); -webkit-appearance: none; cursor: pointer; }
  .dock .dbtn:active { transform: scale(.98); }
  .dock .dbtn.hidden { display: none; }

  /* ── ACTION SHEET ── */
  .scrim { position: fixed; inset: 0; z-index: 35; background: rgba(4,6,10,.5); opacity: 0; pointer-events: none; transition: opacity .22s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; transform: translateY(102%);
    transition: transform .26s cubic-bezier(.3,.9,.3,1);
    background: var(--panel); border-top: 1px solid var(--line-2); border-radius: 20px 20px 0 0;
    padding: 8px 16px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -20px 50px -20px rgba(0,0,0,.8);
    max-height: 88vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .sheet.up { transform: translateY(0); }
  .sheet .sinner { max-width: 720px; margin: 0 auto; }
  .grab { width: 38px; height: 4px; border-radius: 999px; background: var(--line-2); margin: 2px auto 12px; }
  .sheet .sh { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .sheet .sh .st2 { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 7px var(--good); flex: none; }
  .sheet .sh .st2.idle { background: var(--dim); box-shadow: none; } .sheet .sh .st2.offline { background: var(--bad); box-shadow: 0 0 7px var(--bad); }
  .sheet .sh .id { font: 800 15px/1 var(--sans); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet .sh .ctxpill { margin-left: auto; flex: none; font: 10px/1 var(--mono); font-weight: 700; padding: 5px 8px; border-radius: 999px;
    color: var(--dim); background: rgba(255,255,255,.05); }
  .sheet .sh .ctxpill.green { color: var(--good); background: rgba(55,211,154,.12); }
  .sheet .sh .ctxpill.amber { color: var(--warn); background: rgba(246,196,83,.13); }
  .sheet .sh .ctxpill.red { color: var(--bad); background: rgba(251,113,133,.14); }
  .sheet .sh .x { flex: none; font: 16px/1 var(--dim); padding: 4px 6px; cursor: pointer; }
  .sheet .subline { font: 11px/1.4 var(--mono); color: var(--faint); margin: 0 0 13px; overflow-wrap: anywhere; }
  /* full action grid — EVERYTHING one tap */
  .agrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .agrid button { font: 600 11px/1.15 var(--sans); padding: 12px 4px; border-radius: 12px; border: 1px solid var(--line-2);
    background: var(--panel-2); color: var(--txt); display: flex; flex-direction: column; align-items: center; gap: 5px;
    position: relative; cursor: pointer; -webkit-appearance: none; }
  .agrid button:active { transform: scale(.97); }
  .agrid button .e { font-size: 18px; }
  .agrid button.prim { background: rgba(138,166,255,.14); border-color: rgba(138,166,255,.32); color: var(--accent); }
  .agrid button.warn { color: var(--warn); border-color: rgba(246,196,83,.3); background: rgba(246,196,83,.09); }
  .agrid button.bad { color: var(--bad); border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.08); }
  .agrid button.armed { color: #fff; background: rgba(251,113,133,.32); border-color: rgba(251,113,133,.6); }
  .agrid button.new::after { content: "NEW"; position: absolute; top: 4px; right: 6px; font: 6.5px/1 var(--mono); color: var(--accent); }
  .agrid button:disabled { opacity: .45; cursor: default; }
  /* token/model controls inside the sheet (folded in from the Lane manager) */
  .qctl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .qctl.wide { grid-template-columns: 1fr; }
  .qctl label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .qctl label > span { font: 9px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--faint); }
  .qctl select { width: 100%; min-width: 0; -webkit-appearance: none; appearance: none; font: 12px/1 var(--mono); color: var(--txt);
    background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 11px 30px 11px 12px;
    background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%);
    background-position: calc(100% - 15px) 17px, calc(100% - 10px) 17px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
  .qctlnote { font: 11px/1.4 var(--mono); color: var(--faint); margin-top: 10px; }
  .applyrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .applyrow .b { font: 600 12px/1 var(--sans); padding: 11px; border-radius: 10px; text-align: center; cursor: pointer; -webkit-appearance: none; }
  .applyrow .b.prev { color: var(--accent); background: rgba(138,166,255,.13); border: 1px solid rgba(138,166,255,.28); }
  .applyrow .b.arm { color: var(--warn); background: rgba(246,196,83,.13); border: 1px solid rgba(246,196,83,.32); font-weight: 700; }
  .applyrow .b:active { transform: scale(.98); }
  /* inline peek inside the sheet (reuses the fc-v49 peek machinery via data-peekbox) */
  .peek { margin-top: 12px; background: #0a0d13; border: 1px solid var(--line); border-radius: 11px; overflow: hidden; display: none; }
  .peek.open { display: block; }
  .peek .ph { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font: 11px var(--mono); color: var(--dim); }
  .peek .ph .raw { margin-left: auto; color: var(--accent); cursor: pointer; }
  .peek .body { max-height: 40vh; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 0; }
  .peek .ln { padding: 2px 14px; font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; color: var(--txt); }
  .peek .ln.now { color: #bcd0ff; box-shadow: inset 3px 0 0 var(--accent); }
  .peek .raw-pre { margin: 0; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font: 11px/1.5 var(--mono); color: #9fe8b0; }
  .peek .peek-empty { padding: 10px 12px; color: var(--dim); font-style: italic; }
  /* bulk plan panel inside the sheet */
  .bulkplan { margin-top: 6px; font: 12px/1.5 var(--mono); color: var(--dim); }
  .bulkplan .bp-sum { color: var(--txt); font: 700 13px/1.4 var(--sans); margin-bottom: 8px; overflow-wrap: anywhere; }
  .bulkplan .bp-lane { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; overflow-wrap: anywhere; }
  .bulkplan .bp-act { font-weight: 700; } .bulkplan .bp-act.ok { color: var(--good); }
  .bulkplan .bp-act.skip { color: var(--dim); } .bulkplan .bp-act.fail { color: var(--bad); }
  .bulkplan .bp-err { color: var(--bad); font-weight: 700; overflow-wrap: anywhere; }
  .bulkconfirm { width: 100%; margin-top: 12px; font: 700 13px/1 var(--sans); color: #2a1e02; padding: 13px;
    border-radius: 10px; border: none; background: linear-gradient(160deg, var(--warn), #c8993a); cursor: pointer; -webkit-appearance: none; }
  .bulkconfirm:disabled { opacity: .6; cursor: default; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: calc(78px + env(safe-area-inset-bottom)); transform: translateX(-50%); max-width: 92%;
    background: var(--panel-2); color: var(--txt); border: 1px solid rgba(55,211,154,.4); border-radius: 12px; padding: 11px 15px;
    font: 12.5px/1.35 var(--sans); opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 55; text-align: center; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; } .toast.bad { border-color: rgba(251,113,133,.5); color: var(--bad); }
</style>
</head>

<div id="ptr"><span class="spin">&darr;</span><span id="ptrTxt">Pull to refresh</span></div>

<script src="/static/fleet.js"></script>
<script>
  (function () {
    if (!('serviceWorker' in navigator)) return;
    // ONE-SHOT reload when a new SW takes control (unchanged from fc-v49; the
    // guard survives the reload via sessionStorage so it can never loop).
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (!hadController) return;
      if (sessionStorage.getItem('fleet_sw_reloaded')) return;
      sessionStorage.setItem('fleet_sw_reloaded', '1');
      window.location.reload();
    });
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function (reg) {
      if (!reg) return;
      var checkUpdate = function () { try { reg.update(); } catch (e) {} };
      setInterval(checkUpdate, 60000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) checkUpdate(); });
      checkUpdate();
    }).catch(function () {});
  })();
</script>
