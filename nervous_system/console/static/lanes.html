<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Lane manager · Fleet</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" type="image/x-icon" href="/static/icons/favicon.ico" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<style>
  /* Mobile-FIRST (op#10706 B): single column, big tap targets, readable at ~390px.
     Ground-truth token+model per body — process-verified, never declared. */
  :root {
    --bg:#0b0e14; --panel:#121722; --panel-2:#0e131c; --line:#222a38;
    --txt:#d7dce5; --dim:#8a93a6; --accent:#5b8cff; --good:#3ecf8e;
    --warn:#f0b429; --bad:#ff6b6b; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--txt);
    font:14px/1.4 -apple-system, system-ui, sans-serif; overflow-x:hidden; }
  .wrap { max-width:640px; margin:0 auto; padding:14px 12px calc(28px + env(safe-area-inset-bottom)); }
  header { position:sticky; top:0; z-index:5; background:linear-gradient(180deg,#10151f,#0b0e14);
    margin:-14px -12px 12px; padding:14px 14px 12px; border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:10px; }
  .back { color:var(--dim); text-decoration:none; font:600 13px/1 var(--mono); flex:none; }
  h1 { font-size:16px; margin:0; font-weight:700; letter-spacing:.2px; }
  .refresh { margin-left:auto; flex:none; border:1px solid var(--line); background:var(--panel);
    color:var(--accent); font:600 12px/1 var(--mono); padding:9px 12px; border-radius:9px; }
  .refresh:active { background:var(--panel-2); }
  .sub { margin-top:9px; color:var(--dim); font:12px/1.35 var(--mono); }
  .sub b.bad { color:var(--bad); } .sub b.good { color:var(--good); }
  /* One card per body. STACKED lines (each fact on its own wrapped row) so a wide
     off-account card can NEVER clip at 390px (op#10706 B mobile fix). */
  .row { border:1px solid var(--line); border-left:3px solid var(--line);
    border-radius:11px; background:var(--panel); padding:12px 13px; margin-bottom:10px; }
  .row.bad { border-left-color:var(--bad); background:linear-gradient(90deg, rgba(255,107,107,.09), var(--panel) 60%); }
  .row.unver { border-left-color:var(--dim); opacity:.9; }
  .r1 { display:flex; align-items:center; flex-wrap:wrap; gap:6px 9px; }
  .who { font:700 15px/1.15 var(--mono); color:var(--txt); overflow-wrap:anywhere; flex:1 1 auto; min-width:0; }
  .badge { margin-left:auto; flex:none; font:700 10px/1 var(--mono); letter-spacing:.5px;
    padding:4px 8px; border-radius:999px; white-space:nowrap; }
  .badge.ok { color:var(--good); background:rgba(62,207,142,.12); }
  .badge.bad { color:var(--bad); background:rgba(255,107,107,.15); }
  .badge.unver { color:var(--dim); background:var(--panel-2); }
  .line { margin-top:7px; font:12px/1.3 var(--mono); overflow-wrap:anywhere; }
  .line.meta { display:flex; flex-wrap:wrap; gap:6px 12px; }
  .line.meta > * { min-width:0; overflow-wrap:anywhere; }
  .acct { font-weight:700; font-size:13px; }
  .row.ok .acct { color:var(--good); } .row.bad .acct { color:var(--bad); }
  .row.unver .acct { color:var(--dim); }
  .exp { color:var(--bad); }
  .model { color:var(--accent); font-weight:700; }
  .model.none { color:var(--dim); font-weight:400; }
  .kv { color:var(--dim); } .kv b { color:var(--txt); font-weight:600; }
  .fp { color:var(--dim); }
  /* R2b select controls — one per row, full-width, big tap targets. Stacked (not
     side-by-side) so a long option can never push a select past 390px. */
  .controls { display:flex; flex-direction:column; gap:9px; margin-top:11px;
    padding-top:10px; border-top:1px solid var(--line); }
  .ctl { display:flex; align-items:center; gap:9px; min-width:0; }
  .ctl > span { color:var(--dim); font:11px/1.1 var(--mono); flex:0 0 92px; }
  .ctl select { flex:1 1 auto; width:100%; min-width:0; max-width:100%;
    background:var(--panel-2); color:var(--txt); border:1px solid var(--line);
    border-radius:8px; padding:10px 9px; font:13px var(--mono); }
  .ctlnote { color:var(--dim); font:11px/1.3 var(--mono); }
  .empty { color:var(--dim); text-align:center; padding:40px 0; font:13px var(--mono); }
  .stamp { color:var(--dim); text-align:center; margin-top:14px; font:11px var(--mono); }
  /* Add-token form (op#10706). Paste-once; only the fp is ever shown back. */
  .addtok { margin:0 0 12px; border:1px solid var(--line); border-radius:10px; background:var(--panel); }
  .addtok > summary { padding:11px 14px; color:var(--accent); font:600 13px/1 var(--mono); cursor:pointer; list-style:none; }
  .addtok > summary::-webkit-details-marker { display:none; }
  .addtok-body { display:flex; flex-direction:column; gap:9px; padding:0 14px 13px; }
  .addtok-body input { width:100%; background:var(--panel-2); color:var(--txt);
    border:1px solid var(--line); border-radius:8px; padding:11px 10px; font:13px var(--mono); }
  .tokadd { background:var(--accent); color:#06122e; border:none; border-radius:8px;
    padding:12px; font:700 13px/1 var(--mono); }
  .tokadd:disabled { opacity:.5; }
  .addtok-note { color:var(--dim); font:11px/1.35 var(--mono); }
  /* Action toast for pointer writes. */
  .toast { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom));
    transform:translateX(-50%); max-width:92%; background:var(--panel); color:var(--txt);
    border:1px solid var(--good); border-radius:10px; padding:11px 15px; font:12px/1.3 var(--mono);
    opacity:0; pointer-events:none; transition:opacity .18s; z-index:20; text-align:center; }
  .toast.show { opacity:1; }
  .toast.bad { border-color:var(--bad); color:var(--bad); }
  /* Apply-preview (R3 dry-run) buttons + modal. */
  .applyrow { display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .prevbtn { flex:1 1 auto; background:var(--panel-2); color:var(--accent);
    border:1px solid var(--line); border-radius:8px; padding:10px; font:600 12px/1 var(--mono); }
  .prevbtn:active { background:var(--line); }
  /* Armed APPLY (R4) — amber to mark it as the real, operator-driven action. */
  .armbtn { flex:1 1 auto; background:rgba(240,180,41,.10); color:var(--warn);
    border:1px solid rgba(240,180,41,.4); border-radius:8px; padding:10px; font:700 12px/1 var(--mono); }
  .armbtn:active { background:rgba(240,180,41,.2); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none;
    align-items:flex-end; justify-content:center; z-index:30; }
  .modal.show { display:flex; }
  .modal-box { width:100%; max-width:640px; max-height:80vh; overflow:auto; background:var(--panel);
    border:1px solid var(--line); border-radius:14px 14px 0 0; padding:16px 15px calc(18px + env(safe-area-inset-bottom)); }
  .modal-h { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; font:13px var(--mono); }
  .modal-h b { color:var(--txt); }
  .dryflag { margin-left:auto; color:var(--warn); font:700 10px/1 var(--mono); letter-spacing:.4px;
    background:rgba(240,180,41,.12); padding:4px 8px; border-radius:999px; }
  #pvText { white-space:pre-wrap; overflow-wrap:anywhere; color:var(--txt); font:12px/1.45 var(--mono);
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px; padding:11px; margin:0 0 12px; }
  .pvclose { width:100%; background:var(--accent); color:#06122e; border:none; border-radius:9px;
    padding:12px; font:700 13px/1 var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <a class="back" href="/fleet">← Fleet</a>
      <h1>Lane manager</h1>
      <button id="refresh" class="refresh">↻</button>
    </div>
    <div id="sub" class="sub">Loading ground-truth…</div>
  </header>
  <details id="addtok" class="addtok">
    <summary>+ Add token</summary>
    <div class="addtok-body">
      <input id="tokName" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="name (a-z 0-9 -, e.g. musa2)" />
      <input id="tokVal" type="password" autocomplete="off" placeholder="paste OAuth token (written once)" />
      <button id="tokAdd" class="tokadd">Add token</button>
      <div class="addtok-note">Stored 0600 on this host, never shown again — only its fingerprint. gazzabyte is refused.</div>
    </div>
  </details>
  <div id="rows"></div>
  <div id="stamp" class="stamp"></div>
</div>
<div id="toast" class="toast"></div>
<div id="previewModal" class="modal">
  <div class="modal-box">
    <div class="modal-h"><b id="pvTitle"></b><span class="dryflag">DRY-RUN — nothing relaunches</span></div>
    <pre id="pvText"></pre>
    <button id="pvClose" class="pvclose">Close</button>
  </div>
</div>
<script src="/static/lanes.js"></script>
</body>
</html>
