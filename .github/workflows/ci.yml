name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    # Job-level env so step-level `if: env.DATABASE_URL != ''` resolves correctly.
    # GitHub Actions disallows `secrets.X` in step-level `if:` expressions
    # (parse-time error, results in 0-job startup failure).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-asyncio

      - name: Syntax check
        run: python -m py_compile cto_bot.py

      - name: Migration additive linter
        run: |
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            python scripts/check_additive_migration.py "$f"
          done

      - name: Test (unit + integration-skipped-when-no-DSN)
        run: python -m pytest tests/ -v

      - name: Integration tests gate (BLOCK MERGE per CAI-RESP-153 P1)
        if: env.DATABASE_URL != ''
        run: |
          echo "DATABASE_URL secret is configured; explicitly running integration suite."
          python -m pytest tests/ -v -k "integration"
