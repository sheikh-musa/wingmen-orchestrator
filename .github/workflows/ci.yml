name: CI

on:
  push:
    branches: [main, fable/substrate-safe-fixes]
  pull_request:
    branches: [main, fable/substrate-safe-fixes]

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    # NO DATABASE_URL job-env. It used to be `${{ secrets.DATABASE_URL }}`, but the
    # 09-28 rotation pointed that secret at the PRODUCTION substrate, so every CI run
    # executed DB tests against prod (backlog#68 incident, bus #45605/#46564). The
    # secret is deleted and this env is removed so CI can NEVER reach a prod store.
    # DATABASE_URL is instead set by the "Bootstrap ephemeral schema" step below,
    # which points it at a disposable local pg17 cluster (never a prod silo). The
    # root conftest.py prod-ref guard fail-closes anyway if a prod DSN is ever
    # resolved (local or CI).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-asyncio

      - name: Install PostgreSQL 17 (for migration wet-proofs + ephemeral bootstrap)
        # tests/migrations/* spin up their OWN ephemeral pg17 (initdb/pg_ctl on a
        # unix socket, torn down per session) — they need the pg17 BINARIES on the
        # runner, NOT a service/DSN. Without them the whole migration suite SKIPS,
        # so migration wet-proofs never run in CI (backlog#68, bus #43327).
        # postgresql-17-pgvector is the apt package backing `CREATE EXTENSION
        # vector` in ci_bootstrap_schema.py's platform shim (mamadah_notes.embedding
        # is a real public.vector(1024) column, not a shim) — see that script's
        # comment pointing back at this step.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17 postgresql-17-pgvector

      - name: Syntax check
        # compileall over the tree (cto_bot.py moved to legacy/; a single-file py_compile
        # of a path that no longer exists would error, and checked nothing else anyway).
        run: python -m compileall -q -x '(\.venv|legacy)' .

      - name: Migration additive linter
        run: |
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            python scripts/check_additive_migration.py "$f"
          done

      - name: Bootstrap ephemeral schema (cp#83/backlog#68)
        # Brings up a throwaway local pg17 cluster, replays schema.sql +
        # supabase/migrations/*.sql + migrations/*.sql against it, and appends
        # DATABASE_URL to $GITHUB_ENV so the Test step below sees a live DSN —
        # this is what lets the 601 previously-DSN-skipped DB-integration tests
        # actually run in CI instead of skipping unconditionally.
        env:
          WINGMEN_PG17_BIN: /usr/lib/postgresql/17/bin
        run: python scripts/ci_bootstrap_schema.py up

      - name: Test (unit + integration, against the ephemeral schema)
        # WINGMEN_PG17_BIN points the migration fixture (tests/migrations/*, a
        # SEPARATE disposable cluster per test session) at the PGDG install so
        # its own ephemeral pg17 starts (LC_ALL=C avoids the macOS
        # multithreaded-postmaster fault; harmless on Linux). DATABASE_URL (set
        # above) now points DB-integration tests at the bootstrapped cluster.
        #
        # tests/ci_known_failing.txt deselects pre-existing failures this bootstrap
        # exposed for the first time (DB-integration tests silently skipped in CI
        # since the 09-28 incident, bus #45605/#46564) but did not cause — see that
        # file's header for the tracked-follow-up contract (cp#83/backlog#68,
        # decision pending cc-orchestrator per bus #53227). The list must only
        # shrink; a fixed test's line is deleted in the same PR as its fix.
        env:
          WINGMEN_PG17_BIN: /usr/lib/postgresql/17/bin
        run: |
          deselect_args=()
          while IFS= read -r nodeid; do
            [ -z "$nodeid" ] && continue
            case "$nodeid" in '#'*) continue ;; esac
            deselect_args+=(--deselect "$nodeid")
          done < tests/ci_known_failing.txt
          python -m pytest tests/ -v "${deselect_args[@]}"

      - name: Teardown ephemeral schema
        # Always run, even on test failure, so a dead runner never leaks the
        # pg_ctl background process past this job.
        if: always()
        run: python scripts/ci_bootstrap_schema.py down
