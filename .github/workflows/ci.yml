name: CI

on:
  push:
    branches: [main, fable/substrate-safe-fixes]
  pull_request:
    branches: [main, fable/substrate-safe-fixes]

jobs:
  quality:
    name: Lint & Test
    runs-on: ubuntu-latest

    # NO DATABASE_URL job-env. It used to be `${{ secrets.DATABASE_URL }}`, but the
    # 09-28 rotation pointed that secret at the PRODUCTION substrate, so every CI run
    # executed DB tests against prod (backlog#68 incident, bus #45605/#46564). The
    # secret is deleted and this env is removed so CI can NEVER reach a prod store.
    # DB-integration tests SKIP (no DSN) until a follow-up wires an EPHEMERAL migrated
    # Postgres here (DATABASE_URL -> localhost). The root conftest.py prod-ref guard
    # fail-closes anyway if a prod DSN is ever resolved (local or CI).

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 2>/dev/null || true
          pip install pytest pytest-asyncio

      - name: Install PostgreSQL 17 (for migration wet-proofs)
        # tests/migrations/* spin up their OWN ephemeral pg17 (initdb/pg_ctl on a
        # unix socket, torn down per session) — they need the pg17 BINARIES on the
        # runner, NOT a service/DSN. Without them the whole migration suite SKIPS,
        # so migration wet-proofs never run in CI (backlog#68, bus #43327).
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17

      - name: Syntax check
        # compileall over the tree (cto_bot.py moved to legacy/; a single-file py_compile
        # of a path that no longer exists would error, and checked nothing else anyway).
        run: python -m compileall -q -x '(\.venv|legacy)' .

      - name: Migration additive linter
        run: |
          for f in supabase/migrations/*.sql; do
            [ -f "$f" ] || continue
            python scripts/check_additive_migration.py "$f"
          done

      - name: Test (unit + integration-skipped-when-no-DSN)
        # WINGMEN_PG17_BIN points the migration fixture at the PGDG install so its
        # ephemeral pg17 starts (and LC_ALL=C inside the fixture avoids the macOS
        # multithreaded-postmaster fault; harmless on Linux). Migration tests now
        # RUN here instead of skipping; DB-integration tests still skip with no DSN.
        env:
          WINGMEN_PG17_BIN: /usr/lib/postgresql/17/bin
        run: python -m pytest tests/ -v

      # (Removed) "Integration tests gate": it keyed on env.DATABASE_URL, now gone, so it
      # never ran; and its `-k integration` filter matched 0 tests (dead step, #44543-3).
      # The real integration gate returns when an EPHEMERAL migrated Postgres is wired
      # here (follow-up); until then DB-integration tests skip in the step above.
